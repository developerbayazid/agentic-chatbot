[project]
name = "agentic-chatbot"
version = "0.1.0"
description = "Modular CLI chatbot built with LangChain and LangGraph"
readme = "README.md"
authors = [
    { name = "developerbayazid", email = "bayazid.freelancer@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "faiss-cpu>=1.16.0",
    "langchain>=1.4.9",
    "langchain-openai>=1.7.4",
    "langchain-text-splitters>=1.0",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "langsmith>=0.14.17",
    "numpy>=2",
    "pypdf>=7.1.0",
    "prompt-toolkit>=3.0.53",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "rich>=15.0.0",
    "streamlit>=1.67.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
agentic-chatbot = "agentic_chatbot:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    'ignore:.*asyncio\.iscoroutinefunction.*:DeprecationWarning',
]
