[project]
name = "agentic-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "developerbayazid", email = "bayazid.freelancer@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.9",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[project.scripts]
agentic-chatbot = "agentic_chatbot:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
